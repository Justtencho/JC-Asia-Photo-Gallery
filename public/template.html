<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --muted:#8a8a8a;
    --line:#e7e7e7;
    --line-strong:#1a1a1a;
    --bg:#ffffff;
    --gap: 28px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Raleway', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Top bar ---------- */
  header.site-head{
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:50;
    border-bottom:1px solid var(--line);
  }

  .head-inner{
    max-width:1200px;
    margin:0 auto;
    padding:22px 40px 0 40px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    flex-wrap: wrap;
    gap:24px;
  }

  .brand{
    font-weight:400;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--ink);
    background:transparent;
    border:none;
    font-family:'Raleway', sans-serif;
    padding:0 0 18px 0;
    outline:none;
    cursor:text;
    min-width:120px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-bottom:18px;
  }

  /* Secure Auth UI */
  .auth-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .edit-pwd-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .edit-pwd-wrapper label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }
  .edit-pwd-input {
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    width: 140px;
    transition: border-color 0.15s;
  }
  .edit-pwd-input:focus { border-color: var(--ink); }
  
  .auth-input {
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    width: 140px;
    transition: border-color 0.15s;
  }
  .auth-input:focus { border-color: var(--ink); }
  .auth-btn {
    background: var(--ink);
    color: #fff;
    border: 1px solid var(--ink);
    padding: 7px 14px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  .auth-btn:hover { opacity: 0.85; }
  .auth-msg {
    font-size: 13px;
    font-weight: 500;
  }

  /* High-Capacity Storage Indicator */
  .storage-meter {
    display: none;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    padding-left: 16px;
    border-left: 1px solid var(--line);
  }
  body.edit-mode .storage-meter { display: flex; }
  .storage-text {
    font-size: 11px;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .storage-badge {
    font-size: 9px;
    color: #27ae60;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .mode-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
    padding-left: 16px;
    border-left: 1px solid var(--line);
  }
  .mode-toggle button{
    font-family:'Raleway', sans-serif;
    font-size:12px;
    letter-spacing:0.6px;
    color:var(--muted);
    background:none;
    border:1px solid var(--line);
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .mode-toggle button:hover{ border-color:var(--ink); color:var(--ink); }
  .mode-toggle button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* Mobile Tabs Toggle */
  .mobile-tabs-toggle { display: none; }

  nav.tabs{
    max-width:1200px;
    margin:0 auto;
    padding:0 40px;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:2px;
  }

  .tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 18px;
    cursor:pointer;
    color:var(--muted);
    font-size:15px;
    letter-spacing:0.2px;
    font-weight:400;
    border-bottom:2px solid transparent;
    transition:color .15s ease;
    white-space:nowrap;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--ink); font-weight:500; border-bottom:2px solid var(--ink); }
  .tab .tab-name{ outline:none; }
  
  .tab .remove-tab, .folder-tab-header .remove-tab, .dropdown-item .remove-tab {
    display:none; color:var(--muted); font-size:14px; line-height:1; padding:2px;
  }
  body.edit-mode .tab .remove-tab, body.edit-mode .folder-tab-header .remove-tab, body.edit-mode .dropdown-item .remove-tab { 
    display:inline-block; 
  }
  .tab .remove-tab:hover, .folder-tab-header .remove-tab:hover, .dropdown-item .remove-tab:hover { color:#c0392b; }

  /* ---------- Dropdown Folders ---------- */
  .folder-tab {
    position: relative; color: var(--muted); font-size: 15px; letter-spacing: 0.2px; font-weight: 400;
    border-bottom: 2px solid transparent; transition: color .15s ease;
  }
  .folder-tab:hover { color: var(--ink); }
  .folder-tab.active { color: var(--ink); font-weight: 500; border-bottom: 2px solid var(--ink); }
  
  .folder-tab-header { display: flex; align-items: center; gap: 8px; padding: 12px 18px; cursor: pointer; white-space: nowrap; }
  .folder-tab-header .folder-name { outline: none; }
  .folder-tab-header .chevron { display: flex; align-items: center; justify-content: center; opacity: 0.6; transition: transform 0.2s ease; }
  .folder-tab.open .chevron { transform: rotate(180deg); }

  .dropdown-menu {
    display: none; position: absolute; top: 100%; left: 0; background: var(--bg); border: 1px solid var(--line);
    box-shadow: 0 10px 24px rgba(0,0,0,0.08); min-width: 180px; z-index: 100; flex-direction: column;
    padding: 6px 0; border-radius: 4px;
  }
  .folder-tab.open .dropdown-menu { display: flex; }

  .dropdown-item {
    padding: 12px 18px; font-size: 14px; color: var(--muted); cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; transition: background 0.15s, color 0.15s;
  }
  .dropdown-item:hover { background: #fafafa; color: var(--ink); }
  .dropdown-item.active { color: var(--ink); font-weight: 500; }
  .dropdown-item .tab-name { outline: none; }

  .add-tab-container { display: none; align-items: center; }
  body.edit-mode .add-tab-container { display: flex; }

  .add-tab {
    display: flex; align-items: center; gap: 6px; padding: 12px 10px; color: var(--muted); font-size: 15px;
    cursor: pointer; border-bottom: 2px solid transparent;
  }
  .add-tab:hover{ color:var(--ink); }
  .add-tab-input{
    display:none; font-family:'Raleway', sans-serif; font-size:15px; border:none; border-bottom:1px solid var(--ink);
    outline:none; padding:12px 4px; margin: 0 10px; width:140px; background:transparent; color:var(--ink);
  }

  /* ---------- Gallery ---------- */
  main{ max-width:1200px; margin:0 auto; padding:48px 40px 100px 40px; }

  .section-empty{ text-align:center; color:var(--muted); font-size:15px; padding:100px 20px; letter-spacing:0.3px; }

  .grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--gap); }

  @media (max-width: 860px){ .grid{ grid-template-columns:repeat(2, 1fr); } }

  /* ---------- Mobile Responsiveness ---------- */
  @media (max-width: 540px){
    .grid{ grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .head-inner{ padding: 18px 20px 14px 20px; flex-direction: column; align-items: stretch; gap: 16px; }
    .header-actions { padding-bottom: 0; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 16px; flex-wrap: wrap; }
    .storage-meter { padding-left: 0; border-left: none; align-items: flex-start; }
    .mode-toggle { padding-left: 0; border-left: none; }
    main{ padding:32px 20px 80px 20px; }

    .mobile-tabs-toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: #fafafa; border-top: 1px solid var(--line); cursor: pointer; font-size: 15px; font-weight: 500; user-select: none; }
    .mobile-tabs-toggle .chevron { transition: transform 0.2s ease; }
    .mobile-tabs-toggle.open .chevron { transform: rotate(180deg); }
    
    nav.tabs{ 
      display: none; position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg); flex-direction: column;
      align-items: stretch; padding: 0; border-bottom: 1px solid var(--line); box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    nav.tabs.open { display: flex; }
    
    .tab, .folder-tab { border-bottom: 1px solid var(--line) !important; border-left: 3px solid transparent; }
    .tab.active, .folder-tab.active { border-left: 3px solid var(--ink) !important; background: #fafafa; }
    .folder-tab-header { width: 100%; padding: 14px 20px; }
    
    .dropdown-menu { position: static; box-shadow: none; border: none; border-top: 1px solid var(--line); width: 100%; padding: 0; background: #fbfbfb; border-radius: 0; }
    .dropdown-item { padding: 14px 20px 14px 40px; border-bottom: 1px solid var(--line); }
    .dropdown-item:last-child { border-bottom: none; }
    .add-tab-container { padding: 14px 20px; flex-wrap: wrap; }
    .add-tab-input { width: 100%; margin: 10px 0 0 0; }
  }

  .photo-card{
    position:relative; aspect-ratio:1/1; overflow:hidden; background:#ffffff; cursor:pointer; border: 1px solid transparent;
  }
  .photo-card img{ width:100%; height:100%; object-fit:contain; display:block; transition:transform .5s ease; }
  .photo-card:hover img{ transform:scale(1.035); }

  /* --- Security Lock Aesthetics --- */
  .locked-item {
    background: #f0f0f0 !important;
    border: 1px solid var(--line);
    cursor: default;
  }
  .locked-item img, .locked-item .text-content {
    filter: blur(30px);
    opacity: 0.4;
    pointer-events: none;
    user-select: none;
  }
  .locked-overlay {
    display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
    font-size: 32px; z-index: 5; pointer-events: none; opacity: 0.8;
  }
  .locked-item .locked-overlay { display: flex; }

  img{ -webkit-user-drag:none; user-drag:none; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }

 /* ---------- Text Note Cards ---------- */
  .photo-card.text-type {
    display: flex; flex-direction: column; padding: 24px; background: #ffffff; border: 1px solid transparent; cursor: default;
  }
  
  .text-content {
    flex: 1; width: 100%; height: 100%; outline: none; overflow-y: auto; font-family: 'Raleway', sans-serif;
    font-size: 16px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; word-break: break-word;
  }
  body.view-mode .text-content { cursor: pointer; }
  
  .text-content::-webkit-scrollbar { width: 6px; }
  .text-content::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 4px; }
  .text-content::-webkit-scrollbar-track { background: transparent; }

  /* Typography Toolbar */
  .text-card-toolbar {
    display: none; position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.98);
    border: 1px solid var(--line); border-radius: 24px; padding: 6px 14px; gap: 8px; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    align-items: center; white-space: nowrap;
  }
  body.edit-mode .photo-card.text-type:focus-within .text-card-toolbar,
  body.edit-mode .photo-card.text-type:hover .text-card-toolbar {
    display: flex;
  }
  .toolbar-label { font-size: 11px; color: var(--muted); margin-right: 4px; letter-spacing: 0.3px; font-weight: 500; }
  .text-card-toolbar button {
    background: none; border: 1px solid var(--line); font-family: 'Raleway', sans-serif; font-size: 11px; font-weight: 600;
    padding: 6px 12px; cursor: pointer; border-radius: 12px; color: var(--ink); transition: background 0.15s;
  }
  .text-card-toolbar button:hover { background: #f0f0f0; }

  /* Controls */
  .photo-remove{
    display:none; position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:rgba(255,255,255,0.95); color:var(--ink); align-items:center; justify-content:center; font-size:15px;
    cursor:pointer; z-index:15; border:1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  body.edit-mode .photo-remove{ display:flex; }
  .photo-remove:hover{ background:#c0392b; color:#fff; border-color:#c0392b; }

  .photo-lock {
    display: none; position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.95); color: var(--ink); align-items: center; justify-content: center; font-size: 12px;
    cursor: pointer; z-index: 15; border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  body.edit-mode .photo-lock { display: flex; }
  .photo-lock:hover { background: #f0f0f0; }

  .photo-download {
    display: none; position: absolute; bottom: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.95); color: var(--ink); align-items: center; justify-content: center; font-size: 14px; font-weight: bold;
    cursor: pointer; z-index: 15; border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  body.edit-mode .photo-download { display: flex; }
  .photo-download:hover { background: #f0f0f0; }

  /* ---------- Add Item Container ---------- */
  .add-item-card { display:none; aspect-ratio:1/1; border:1.5px dashed var(--line); color:var(--muted); }
  body.edit-mode .add-item-card.show { display: flex; flex-direction: row; }
  .add-item-btn {
    flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; font-size: 13px; letter-spacing: 0.4px; transition: background 0.15s, color 0.15s;
  }
  .add-item-btn:hover { background: #fafafa; color: var(--ink); border-color: var(--ink); }
  .add-item-btn:first-child { border-right: 1.5px dashed var(--line); }
  .add-item-btn:hover:first-child { border-right-color: var(--ink); }
  .add-item-btn .plus { font-size:28px; font-weight:300; line-height:1; }

  .count-note{ margin-top:18px; font-size:12px; color:var(--muted); letter-spacing:0.3px; }

  /* ---------- Lightbox ---------- */
  .lightbox{
    display:none; position:fixed; inset:0; background:rgba(255,255,255,0.98); z-index:200; flex-direction:column;
    align-items:center; justify-content:center; padding:40px 24px;
  }
  .lightbox.open{ display:flex; }

  .lightbox-close{
    position:absolute; top:24px; right:32px; font-size:28px; font-weight:300; color:var(--ink); cursor:pointer;
    background:none; border:none; line-height:1;
  }
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); font-size:26px; color:var(--muted); background:none;
    border:none; cursor:pointer; padding:14px;
  }
  .lightbox-nav:hover{ color:var(--ink); }
  .lightbox-prev{ left:8px; }
  .lightbox-next{ right:8px; }

  .lightbox-img-wrap{ position:relative; max-width: 95vw; max-height: 80vh; display:flex; align-items:center; justify-content:center; }
  .lightbox-img-wrap img{ max-width:100%; max-height: 80vh; object-fit:contain; box-shadow:0 20px 60px rgba(0,0,0,0.12); }
  
  .lightbox-text-wrap {
    display: none; width: 90%; max-width: 800px; max-height: 80vh; overflow-y: auto; background: #ffffff; padding: 60px;
    font-family: 'Raleway', sans-serif; font-size: 26px; line-height: 1.6; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); white-space: pre-wrap; word-break: break-word;
  }

  .lightbox-caption{ max-width:640px; width:100%; margin-top:28px; text-align:center; }
  .lightbox-title{ font-size:20px; font-weight:600; color:var(--ink); margin:0 0 8px 0; outline:none; min-height:1.3em; }
  .lightbox-desc{ font-size:14px; font-weight:400; color:var(--muted); line-height:1.6; margin:0; outline:none; min-height:1.4em; }
  .lightbox-title[data-placeholder]:empty:before, .lightbox-desc[data-placeholder]:empty:before{ content:attr(data-placeholder); color:#c7c7c7; }
  body.view-mode .lightbox-title, body.view-mode .lightbox-desc{ cursor:default; }
  
  .edit-hint{ display:none; margin-top:10px; font-size:11px; color:#c7c7c7; letter-spacing:0.3px; }
  body.edit-mode .edit-hint{ display:block; }

  /* ---------- Export bar ---------- */
  .export-bar{
    display:none; position:fixed; bottom:0; left:0; right:0; background:var(--ink); color:#fff; padding:14px 28px;
    z-index:150; align-items:center; justify-content:space-between; gap:16px; font-size:13px; letter-spacing:0.2px;
  }
  body.edit-mode .export-bar{ display:flex; }
  .export-bar span{ opacity:0.75; }
  .export-bar button{
    font-family:'Raleway', sans-serif; background:#fff; color:var(--ink); border:none; padding:9px 20px;
    border-radius:20px; cursor:pointer; font-size:13px; letter-spacing:0.3px;
  }
  .export-bar button:hover{ opacity:0.85; }
  .export-bar .bar-actions{ display:flex; gap:10px; flex-shrink:0; }
  .export-bar button.ghost{ background:none; color:#fff; border:1px solid rgba(255,255,255,0.4); }
  .export-bar button.ghost:hover{ opacity:1; border-color:#fff; }

  input[type=file]{ display:none; }
  body.locked .mode-toggle{ display:none !important; }

  /* --- Drag & Drop Reordering --- */
  .photo-card.dragging {
    opacity: 0.4;
  }
  .photo-card.drag-over {
    border: 2px dashed var(--ink);
    transform: scale(0.98);
  }

  /* ---------- Drag & Drop Overlay ---------- */
  .drag-overlay {
    display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 9999; align-items: center;
    justify-content: center; border: 4px dashed var(--ink); font-size: 24px; color: var(--ink); font-weight: 500; pointer-events: none;
  }
</style>
</head>
<body class="edit-mode">

<header class="site-head">
  <div class="head-inner">
    <div class="brand" contenteditable="true" spellcheck="false" id="brandTitle">JC</div>
    <div class="header-actions">
        
       <div id="authContainer" class="auth-container">
           <!-- Dynamic Auth UI rendered here -->
       </div>

       <div id="storageMeter" class="storage-meter" title="Local database storage used">
          <span id="storageText" class="storage-text">0.00 MB STORED</span>
          <span class="storage-badge">● IndexedDB Active</span>
       </div>

       <div class="mode-toggle">
         <button id="editBtn" class="active">Edit</button>
         <button id="viewBtn">View</button>
       </div>
    </div>
  </div>
  
  <div class="mobile-tabs-toggle" id="mobileTabsToggle">
    <span id="mobileTabsLabel">Sections</span>
    <svg class="chevron" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </div>

  <nav class="tabs" id="tabsNav"></nav>
</header>

<main>
  <div id="galleryArea"></div>
</main>

<div class="export-bar">
  <span>Edit mode — add up to 200 items per section. Save an editable copy anytime to back up.</span>
  <div class="bar-actions" style="flex-wrap:wrap;">
        <button id="saveProjectBtn" class="ghost" title="Download an HTML copy you can open and continue editing anytime">Download Editable Copy</button>
    <button id="saveShareablePublicBtn" title="Shareable copy with private items removed">Shareable (Public)</button>
    <button id="saveShareablePrivateBtn" title="Shareable copy that includes private items">Shareable (Private)</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#8249;</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext">&#8250;</button>
  
  <div class="lightbox-img-wrap" id="lightboxImgWrap">
     <img id="lightboxImg" src="" alt="">
  </div>
  
  <div class="lightbox-text-wrap" id="lightboxText"></div>
  
  <div class="lightbox-caption" id="lightboxCaption">
    <div class="lightbox-title" id="lightboxTitle" contenteditable="false" data-placeholder="Untitled"></div>
    <div class="lightbox-desc" id="lightboxDesc" contenteditable="false" data-placeholder="Add a description..."></div>
    <div class="edit-hint">Click title or description to edit</div>
  </div>
</div>

<div id="dragOverlay" class="drag-overlay">
  Drop photos to add to the active section
</div>

<input type="file" id="fileInput" accept="image/*" multiple>

<script>
// RESTORED STORAGE KEY to perfectly recall your original photos!
const STORAGE_KEY = 'artGalleryState_v1';
const MAX_PHOTOS_PER_SECTION = 200;

/* --- IndexedDB Storage Engine (Eliminates 5MB Limit) --- */
const DB_NAME = 'PhotoGalleryDB';
const STORE_NAME = 'galleryStore';

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    request.onsuccess = (e) => resolve(e.target.result);
    request.onerror = (e) => reject(e.target.error);
  });
}

async function saveToDB(key, val) {
  try {
    const db = await initDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(val, key);
  } catch(e) {}
}

async function loadFromDB(key) {
  try {
    const db = await initDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  } catch(e) {
    return null;
  }
}

/* --- Cryptography Engine --- */
function encodeUTF8(text) { return unescape(encodeURIComponent(text)); }
function decodeUTF8(bytes) { return decodeURIComponent(escape(bytes)); }

// Encryption disabled - passthrough so the rest of the code keeps working
function encryptData(text, key) { return text; }
function decryptData(b64, key) { return b64; }

// Global Auth State

  title: "JC",
  galleryPassword: null, 
  authCheck: null, 
  items: [
    { type: 'section', name: "Section 1", photos: [] }
  ],
  activePath: { folderIndex: null, sectionIndex: 0 }
};

let openFolderIndex = null; 

async function loadInitialState(){
  if (window.__EMBEDDED_GALLERY_DATA__) {
    return window.__EMBEDDED_GALLERY_DATA__;
  }
  
  let idbData = await loadFromDB(STORAGE_KEY);
  if (idbData) return idbData;

  try {
    let raw = localStorage.getItem('artGalleryState_v1');
    if(!raw) raw = localStorage.getItem('artGalleryState_v3');
    if(raw) {
      const parsed = JSON.parse(raw);
      await saveToDB(STORAGE_KEY, parsed);
      return parsed;
    }
  } catch(e){}
  
  return null;
}

function updateStorageMeter() {
    const textEl = document.getElementById('storageText');
    if(!textEl) return;
    const currentBytes = JSON.stringify(state).length;
    const mbUsed = (currentBytes / 1048576).toFixed(2);
    textEl.textContent = `${mbUsed} MB STORED`;
}

function saveState(){
  saveToDB(STORAGE_KEY, state);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  updateStorageMeter();
}

function getActiveSection() {
  const path = state.activePath;
  if (path.folderIndex !== null) {
    const folder = state.items[path.folderIndex];
    if (folder && folder.sections) {
       return folder.sections[path.sectionIndex];
    }
  } else {
    return state.items[path.sectionIndex];
  }
  return null;
}

function resetActivePath() {
  if (state.items.length === 0) {
     state.items.push({ type: 'section', name: 'Section 1', photos: [] });
     state.activePath = { folderIndex: null, sectionIndex: 0 };
     return;
  }
  const { folderIndex, sectionIndex } = state.activePath;
  if (folderIndex !== null) {
     if (state.items[folderIndex] && state.items[folderIndex].type === 'folder') {
        if (state.items[folderIndex].sections.length > sectionIndex) return;
        if (state.items[folderIndex].sections.length > 0) {
           state.activePath.sectionIndex = state.items[folderIndex].sections.length - 1;
           return;
        }
     }
  } else {
     if (state.items[sectionIndex] && state.items[sectionIndex].type === 'section') return;
  }
  for(let i=0; i<state.items.length; i++) {
     if (state.items[i].type === 'section') {
        state.activePath = { folderIndex: null, sectionIndex: i };
        return;
     }
     if (state.items[i].type === 'folder' && state.items[i].sections.length > 0) {
        state.activePath = { folderIndex: i, sectionIndex: 0 };
        return;
     }
  }
}

function reencryptSection(section, oldPwd, newPwd) {
    section.photos.forEach(p => {
        if (p.locked) {
            let rawSrc = p.src;
            let rawContent = p.content;
            let rawTitle = p.title;
            let rawDesc = p.desc;

            // 1. Recover plain text using old password
            if (oldPwd) {
                if (p.type === 'text') rawContent = decryptData(p.content, oldPwd) || '';
                else rawSrc = decryptData(p.src, oldPwd) || '';
                if(p.title) rawTitle = decryptData(p.title, oldPwd) || '';
                if(p.desc) rawDesc = decryptData(p.desc, oldPwd) || '';
            }

            // 2. Encrypt with new password OR leave as plain text if password removed
            if (newPwd) {
                if (p.type === 'text') p.content = encryptData(rawContent, newPwd);
                else p.src = encryptData(rawSrc, newPwd);
                if(rawTitle) p.title = encryptData(rawTitle, newPwd);
                if(rawDesc) p.desc = encryptData(rawDesc, newPwd);
            } else {
                if (p.type === 'text') p.content = rawContent;
                else p.src = rawSrc;
                p.title = rawTitle;
                p.desc = rawDesc;
                
                p.locked = false; // Auto-unlock if master password is removed entirely
            }
        }
    });
}

            card.classList.remove('drag-over');

                e.preventDefault();
                e.stopPropagation();
                const fromIndex = parseInt(dragData, 10);
                const toIndex = pIndex;
                
                if (!isNaN(fromIndex) && fromIndex !== fromIndex) return; // safety

                const section = getActiveSection();
                const targetItem = section.photos[toIndex];
                const sourceItem = section.photos[fromIndex];

                // Prevent text notes or invalid drops
                if (!sourceItem || sourceItem.type === 'text') return;
                if (targetItem && targetItem.type === 'text') return;

                // Check if user is trying to combine into a 4-photo group slot
                // Hold 'Shift' key while dropping to force nesting/combining, OR drop directly onto a group card
                const isGroupTarget = targetItem.type === 'group';
                const isShiftDrop = e.shiftKey;

                if (isGroupTarget || isShiftDrop) {
                    if (!targetItem.sources) {
                        targetItem.type = 'group';
                        // Convert old string format to object format with empty title/desc
                        targetItem.sources = [{ src: targetItem.src, title: targetItem.title || "", desc: targetItem.desc || "" }];
                        delete targetItem.src;
                        delete targetItem.title;
                        delete targetItem.desc;

                    if (targetItem.sources.length < 4 && fromIndex !== toIndex) {

                            actualObj = sourceItem.sources[0];

                            const decryptedSrc = sourceItem.locked ? decryptData(sourceItem.src, sessionPassword) : sourceItem.src;

                            const decryptedDesc = sourceItem.locked && sourceItem.desc ? decryptData(sourceItem.desc, sessionPassword) : (sourceItem.desc || "");
                            actualObj = { src: decryptedSrc, title: decryptedTitle, desc: decryptedDesc };
                        }

                            section.photos.splice(fromIndex, 1);

                            render();

                        alert("This image block already has the maximum of 4 photos combined.");

                } else {
                    // Standard reordering behavior
                    if (!isNaN(fromIndex) && fromIndex !== toIndex) {
                        const [movedItem] = section.photos.splice(fromIndex, 1);
                        section.photos.splice(toIndex, 0, movedItem);
                        saveState();

/* ---------------- Visually-Lossless Image Compression Engine ---------------- */

function processFiles(fileList) {
  const section = getActiveSection();
  if(!section) {
     alert("Please create or select a section to upload photos into.");
     return;
  }
  
  const room = MAX_PHOTOS_PER_SECTION - section.photos.length;
  const toAdd = fileList.slice(0, room);
  if(fileList.length > room) alert(`Only ${room} more photo(s) can be added to this section (200 max).`);

  let remaining = toAdd.length;
  if(remaining === 0) return;

  toAdd.forEach(file => {
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      
      const MAX_SIZE = 1600;
      if (width > height && width > MAX_SIZE) {
        height = Math.round((height * MAX_SIZE) / width);
        width = MAX_SIZE;
      } else if (height > MAX_SIZE) {
        width = Math.round((width * MAX_SIZE) / height);
        height = MAX_SIZE;
      }
      
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      const optimizedDataUrl = canvas.toDataURL('image/webp', 0.85);
      
      section.photos.push({ type: 'image', src: optimizedDataUrl, title: "", desc: "", locked: false });
      remaining--;
      if(remaining === 0) render();
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      remaining--;
      if(remaining === 0) render();
    };
    img.src = objectUrl;
  });
}

fileInput.addEventListener('change', () => {
  const files = Array.from(fileInput.files || []);
  if(files.length > 0) processFiles(files);
  fileInput.value = "";
});

function getValidGroupIndices(item) {
    if (!item.sources) return [];
    let indices = [];
    for (let i = 0; i < item.sources.length; i++) {
        if (item.sources[i]) indices.push(i);
    }
    return indices;
}

function findNextUnlockedIndex(startIndex, direction) {
  const section = getActiveSection();
  if(!section || section.photos.length <= 1) return startIndex;
  
  const isEdit = body.classList.contains('edit-mode');
  let i = startIndex;
  let checks = 0;
  while(checks < section.photos.length) {
     i = (i + direction + section.photos.length) % section.photos.length;
     const targetItem = section.photos[i];
     // Skip private photos if we are navigating the gallery in Public view
     if (isEdit || currentViewMode === 'private' || !targetItem.locked) return i;
     checks++;
  }
  return startIndex; 
}

lightboxPrev.addEventListener('click', () => {
  if(currentPhotoIndex === null) return;
  const section = getActiveSection();
  const item = section.photos[currentPhotoIndex];
  
  if (item && item.type === 'group' && activeGroupSubIndex !== null) {
      const validIndices = getValidGroupIndices(item);
      const currPos = validIndices.indexOf(activeGroupSubIndex);
      if (currPos > 0) {
          activeGroupSubIndex = validIndices[currPos - 1];
          showCurrentPhoto();
          return;
      } else {
          // Finished going backwards through sub-photos, go to previous main gallery item
          activeGroupSubIndex = null;
      }
  }
  
  currentPhotoIndex = findNextUnlockedIndex(currentPhotoIndex, -1);
  const prevItem = section.photos[currentPhotoIndex];
  if (prevItem && prevItem.type === 'group') {
      const validIndices = getValidGroupIndices(prevItem);
      if (validIndices.length > 0) {
          activeGroupSubIndex = validIndices[validIndices.length - 1]; // start at bottom-right when entering backwards
      }
  } else {
      activeGroupSubIndex = null;
  }
  showCurrentPhoto();
});

lightboxNext.addEventListener('click', () => {
  if(currentPhotoIndex === null) return;
  const section = getActiveSection();
  const item = section.photos[currentPhotoIndex];
  
  if (item && item.type === 'group') {
      const validIndices = getValidGroupIndices(item);
      const currPos = activeGroupSubIndex !== null ? validIndices.indexOf(activeGroupSubIndex) : -1;
      
      if (currPos < validIndices.length - 1 && currPos !== -2) {
          activeGroupSubIndex = currPos === -1 ? validIndices[0] : validIndices[currPos + 1];
          showCurrentPhoto();
          return;
      }
  }
  
  activeGroupSubIndex = null;
  currentPhotoIndex = findNextUnlockedIndex(currentPhotoIndex, 1);
  showCurrentPhoto();
});

/* ---------------- Export & Backup Handlers ---------------- */

function generateExport(type, visibility) {
  const doc = document.documentElement.cloneNode(true);

  const oldData = doc.querySelector('#embeddedDataScript');
  if (oldData) oldData.remove();

  // Clone state so the live gallery isn't touched
  const exportState = JSON.parse(JSON.stringify(state));
  exportState.galleryPassword = null;
  exportState.authCheck = null;

  // Public copy: erase private items from the exported data entirely
  if (visibility === 'public') {
    const stripPrivate = (sec) => {
      sec.photos = sec.photos.filter(p => !p.locked);
      sec.photos.forEach(p => {
        if (p.type === 'group' && p.sources) {
          p.sources = p.sources.filter(s => !(s && typeof s === 'object' && s.locked));
        }
      });
      sec.photos = sec.photos.filter(p => p.type !== 'group' || (p.sources && p.sources.length > 0));
    };
    exportState.items.forEach(item => {
      if (item.type === 'section') stripPrivate(item);
      else if (item.type === 'folder') item.sections.forEach(stripPrivate);
    });
  }

  // Wipe anything already rendered in the clone, so private photo URLs
  // can't hide in the exported HTML (the page re-renders itself on load)
  const wipe = (sel) => { const el = doc.querySelector(sel); if (el) el.innerHTML = ''; };
  wipe('#galleryArea'); wipe('#tabsNav'); wipe('#authContainer');
  wipe('#lightboxText'); wipe('#lightboxTitle'); wipe('#lightboxDesc');
  const lbWrap = doc.querySelector('#lightboxImgWrap');
  if (lbWrap) lbWrap.innerHTML = '<img id="lightboxImg" src="" alt="">';
  const lb = doc.querySelector('#lightbox');
  if (lb) lb.classList.remove('open');

  // Inject data
  const injected = document.createElement('script');
  injected.id = 'embeddedDataScript';
  injected.textContent = 'window.__EMBEDDED_GALLERY_DATA__ = ' +
    JSON.stringify(exportState).replace(/</g, '\\u003c') + ';';
  doc.querySelector('head').appendChild(injected);

  // Force edit / view mode on load
  doc.querySelector('body').setAttribute('class', type === 'editable' ? 'edit-mode' : 'view-mode locked');

  // Download
  const htmlString = "<!DOCTYPE html>\n" + doc.outerHTML;
  const blob = new Blob([htmlString], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeName = (state.title || 'gallery').replace(/[^a-z0-9\-_ ]/gi, '').trim().replace(/\s+/g, '-') || 'gallery';
  a.download = `${safeName}-${type}-${visibility}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Editable copy keeps EVERYTHING (public + private), same as page.tsx
saveProjectBtn.addEventListener('click', () => generateExport('editable', 'private'));
saveShareablePublicBtn.addEventListener('click', () => generateExport('shareable', 'public'));
saveShareablePrivateBtn.addEventListener('click', () => generateExport('shareable', 'private'));

/* ---------------- App Initialization ---------------- */
async function init() {
  document.title = state.title || "JC";
  const loaded = await loadInitialState();
  if (loaded) {
    state = loaded;
    resetActivePath();
  }

  if(window.__EMBEDDED_GALLERY_DATA__){
    if (body.classList.contains('view-mode')) body.classList.add('locked');
    if (body.classList.contains('locked')) {
      setMode('view');
    } else {
      setMode('edit');
    }
  } else {
    setMode('edit');
  }
}

init();
</script>
